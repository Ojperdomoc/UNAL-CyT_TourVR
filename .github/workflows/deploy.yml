name: Deploy a GitHub Pages

# Publica el juego en https://ojperdomoc.github.io/UNAL-CyT_TourVR/
# Requiere: Settings → Pages → Build and deployment → Source = "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages: leer el repo, escribir el sitio y
# permitir el token OIDC que usa deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Las ejecuciones en cola no se cancelan para no dejar
# el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que Pages esté configurado con GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sin este ajuste, deploy-pages falla con un error poco claro.
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo "")
          if [ -n "$build_type" ] && [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages no está configurado::Abre ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages, en «Build and deployment» cambia Source a «GitHub Actions» y vuelve a ejecutar este workflow."
            exit 1
          fi

      - name: Compilar el sitio
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el artefacto del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
